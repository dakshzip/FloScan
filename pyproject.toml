[project]
name = "floscan"
version = "0.1.0"
description = "Local property capture to measured floor plan pipeline (P01 diagnostic skeleton)."
readme = "README.md"
requires-python = ">=3.11"
# P01 runtime dependency set. P02 audits, pins and records every dependency in
# DEPENDENCIES.md; see docs/adr/001-requirements.md for the interim record.
dependencies = [
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
floscan = "floscan.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.5,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
