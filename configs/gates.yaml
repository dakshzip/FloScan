# FloScan requirement and gate registry (project-owned).
#
# This file freezes WHAT the assignment asks for. It never records whether a
# gate passed: pass/fail is produced only by a scored benchmark run (P04+).
# The loader in src/floscan/pipeline.py rejects unknown keys, so a "status" or
# "result" field cannot be smuggled in here.
#
# Every numeric threshold carries `source_value`, a verbatim fragment of
# `source_text`. The loader converts it to SI and requires it to equal `value`,
# so a number that is not in the source documents cannot enter this registry.
#
# Page references are PDF page indexes (1-based), not printed page footers.

registry_version: 1
schema_authority: project_owned

sources:
  - id: case_study
    file: Applied_AI_Case_Study.pdf
    sha256: 26a6392f3171ff0303c0ba7bec3e19cc9ba1b7db982aac0f52622d76d396f769
    pages: 6
    authority: primary
  - id: prd
    file: applied_ai_case_study_engineering_prd.pdf
    sha256: 4b6bfa0aac073455406d152a0636769251392a7db74d785365be4ffcad95895d
    pages: 10
    authority: derived

unavailable_sources:
  - id: published_json_schema
    description: >-
      The "published schema" the assignment requires JSON output to conform to.
      Not supplied with either PDF; the user confirms it is unavailable.
    consequence: >-
      FloScan publishes a project-owned schema and keeps an exporter boundary.
      No conformance to the evaluator schema is claimed.
  - id: round1_specification
    description: >-
      The earlier Round 1 contract and gates ("Round 1 gates apply"). Not
      supplied; the user confirms it is unavailable.
    consequence: >-
      Gates that only Round 1 would define (for example the LiDAR wall-length
      tolerance and floor-area tolerance) are recorded as unspecified_source.
      No threshold is invented for them.

requirements:
